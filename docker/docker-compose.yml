version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: construction_db
    environment:
      POSTGRES_DB: construction_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secret_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - construction_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: construction_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - construction_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: construction_backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: construction_db
      DB_USER: postgres
      DB_PASSWORD: postgres_secret_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      WEATHER_SECRET: ${WEATHER_SECRET:-}
      WEATHER_LAT: ${WEATHER_LAT:-55.7558}
      WEATHER_LON: ${WEATHER_LON:-37.6173}
      DEFAULT_CITY: ${DEFAULT_CITY:-Moscow}
      SITE_NAME: ${SITE_NAME:-СТРОЙПЛОЩАДКА A}
      SKUD_WEBHOOK_TOKEN: ${SKUD_WEBHOOK_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - construction_network
    restart: unless-stopped
    volumes:
      - ./backend/src:/app/src
    command: >
      sh -c "npm run migrate && npm start"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: construction_nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend/src:/usr/share/nginx/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - construction_network
    restart: unless-stopped

networks:
  construction_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
